name: Build images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up upstream PHP and Debian updates
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: cedyrn/php-parent

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      fpm-versions: ${{ steps.fpm-matrix.outputs.fpm-versions }}
      fpm-builds: ${{ steps.fpm-matrix.outputs.fpm-builds }}
      build-date: ${{ steps.build-date.outputs.build-date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One entry per PHP version in versions.json and legacy variant
      - name: Generate matrix
        id: matrix
        run: |
          include=$(jq -c '
            [ to_entries[] as $php
              | ( {variant: "apache", base: "apache"},
                  {variant: "apache-cron", base: "apache"} )
              | . + {version: $php.value, tag: "\($php.key)-\(.variant)"} ]
          ' versions.json)
          echo "include=${include}" >> "$GITHUB_OUTPUT"
          echo "${include}" | jq .

      # Recorded in the FPM image's build info. Set once so every
      # architecture of a build has the same date.
      - name: Build date
        id: build-date
        run: echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # FPM image: one entry per PHP version that gets it, built natively for
      # each architecture
      - name: Generate FPM matrix
        id: fpm-matrix
        run: |
          versions=$(.github/scripts/fpm-versions.sh)
          builds=$(echo "${versions}" | jq -c '
            [ .[] as $php
              | ( {arch: "amd64", platform: "linux/amd64", runner: "ubuntu-latest"},
                  {arch: "arm64", platform: "linux/arm64", runner: "ubuntu-24.04-arm"} )
              | . + $php ]
          ')
          echo "fpm-versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "fpm-builds=${builds}" >> "$GITHUB_OUTPUT"
          echo "${builds}" | jq .

  # Legacy mod_php images
  build:
    name: ${{ matrix.tag }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ matrix.tag }}

      # Built into the local Docker engine so the image that is tested is
      # exactly the image that is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: legacy
          target: ${{ matrix.variant }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            BASE_TYPE=${{ matrix.base }}
          pull: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: tests/smoke-test.sh "${IMAGE}:${{ matrix.tag }}" "${{ matrix.version }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}:${{ matrix.tag }}"

  # FPM image, per PHP version and architecture. Outside pull requests the
  # image is pushed by digest only (no tag), then that exact digest is pulled
  # and tested before it can be published.
  fpm-build:
    name: fpm ${{ matrix.minor }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.fpm-builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ matrix.version }}

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            BUILD_DATE=${{ needs.matrix.outputs.build-date }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker,name=php-parent-test:fpm' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Select image to test
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref=php-parent-test:fpm
          else
            ref="${IMAGE}@${DIGEST}"
            docker pull "${ref}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: tests/fpm-smoke-test.sh "${{ steps.image.outputs.ref }}" "${{ matrix.version }}"

      - name: Record digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.minor }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      # The scanner never sees the Docker Hub token
      - name: Log out of Docker Hub
        if: github.event_name != 'pull_request'
        run: docker logout

      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      # Report only: findings never fail the build. Published images are also
      # scanned daily by scan.yml.
      - name: Vulnerability scan
        continue-on-error: true
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format table --output trivy.txt "${REF}"
          cat trivy.txt
          {
            echo "### fpm ${{ matrix.minor }} (${{ matrix.arch }}): fixable HIGH and CRITICAL vulnerabilities"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Tags each PHP version once every architecture has passed its tests
  fpm-publish:
    name: Publish fpm ${{ matrix.minor }}
    needs: [matrix, fpm-build]
    if: always() && github.event_name != 'pull_request' && needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.fpm-versions) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.minor }}-*
          path: digests
          merge-multiple: true

      - name: Check every architecture passed
        run: |
          count=$(ls digests | wc -l)
          echo "Found ${count} digests"
          [ "${count}" -eq 2 ]

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag ${{ matrix.version }} and ${{ matrix.minor }}
        working-directory: digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ matrix.version }}" \
            -t "${IMAGE}:${{ matrix.minor }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ matrix.version }}"

  # Single required status check for branch protection, independent of
  # which PHP versions are in the matrix.
  result:
    name: Build result
    needs: [build, fpm-build, fpm-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all builds passed
        run: |
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.fpm-build.result }}" = "success"
          # Publishing is skipped on pull requests
          case "${{ needs.fpm-publish.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
