<VirtualHost *:80>
    ServerName localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Pass the Authorization header to PHP (mod_php did this automatically)
        CGIPassAuth On
    </Directory>

    ErrorLog /dev/stderr
    SetEnvIf Request_URI "^/fpm-(ping|status)$" dontlog
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
