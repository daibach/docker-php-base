# Hardening
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Header always unset X-Powered-By
Header unset X-Powered-By

ServerName localhost

# Allow in-flight requests to finish on shutdown, within the orchestrator's stop timeout
GracefulShutdownTimeout 20

# PHP via PHP-FPM. Only existing .php files are passed to FPM, so missing
# files get Apache's 404 rather than FPM's "File not found."
DirectoryIndex index.php index.html

<FilesMatch "\.php$">
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </If>
</FilesMatch>

# FPM health endpoints, mapped before any .htaccess rewrites apply
ProxyPass "/fpm-ping" "fcgi://127.0.0.1:9000/fpm-ping"
ProxyPass "/fpm-status" "fcgi://127.0.0.1:9000/fpm-status"

<Location "/fpm-status">
    Require local
</Location>
